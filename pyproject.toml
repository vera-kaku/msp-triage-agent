[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-triage-agent"
version = "0.1.0"
description = "An AI agent that triages IT service desk tickets for a managed service provider, with rules enforced in code and a draft reply for a technician to review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
openai = ["openai>=1.40"]          # OpenAI, Azure OpenAI and DeepSeek
anthropic = ["anthropic>=0.40"]
hf = ["datasets>=2.19"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
triage = "triage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
